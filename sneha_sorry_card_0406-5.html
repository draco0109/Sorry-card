<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sorry ❤️</title>
<style>
:root{--pink:#ff4f83;--deep:#09070d;--glass:rgba(255,255,255,.09)}
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;overflow:hidden;background:
 radial-gradient(circle at 50% 20%,#4b1935 0,#160b18 38%,#050407 100%);
 color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;
 display:grid;place-items:center;
}
#app{width:min(94vw,430px);height:min(94vh,850px);position:relative}
.screen{
 position:absolute;inset:0;border:1px solid rgba(255,255,255,.16);
 border-radius:30px;background:rgba(10,7,13,.74);backdrop-filter:blur(18px);
 box-shadow:0 25px 90px #0009;display:flex;flex-direction:column;
 align-items:center;justify-content:center;padding:28px;transition:.65s ease;
}
.hidden{opacity:0;pointer-events:none;transform:scale(.94)}
h1{font-size:34px;margin:10px 0;text-align:center}
.small{opacity:.72;text-align:center;margin:0 0 22px}
.lock{font-size:64px;animation:float 2.2s ease-in-out infinite}
input{
 width:100%;padding:16px;border-radius:16px;border:1px solid #ffffff2e;
 background:#0007;color:#fff;text-align:center;font-size:22px;letter-spacing:10px;
 outline:none
}
button{
 border:0;border-radius:16px;padding:15px 24px;background:var(--pink);color:white;
 font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 10px 35px #ff4f8355;
 transition:.2s
}
button:active{transform:scale(.96)}
.open{width:100%;margin-top:14px}
.error{height:22px;color:#ff9bb3;font-size:13px;margin-top:8px}
.card{justify-content:flex-start;overflow:auto;padding:18px 16px 28px}
.photo{
 width:100%;max-height:48%;object-fit:cover;border-radius:22px;
 border:5px solid #fff;box-shadow:0 18px 45px #0008;
 transform:rotate(-1deg);animation:photoIn .9s ease both
}
.note{margin-top:18px;text-align:center;font-size:19px;line-height:1.5;font-weight:650}
.sorry{font-size:31px;font-weight:900;font-style:italic;margin:10px 0 4px;animation:pulse 1.2s infinite}
.heart{
 font-size:76px;line-height:1;filter:drop-shadow(0 0 18px #ff315f);
 animation:heartbeat 1.05s infinite
}
.buttons{display:flex;gap:12px;width:100%;margin-top:12px}
.best{flex:1}
.nope{
 flex:1;background:#29242c;color:#aaa;position:relative;
 border:1px solid #ffffff1c;box-shadow:none
}
.nope:hover{transform:translate(var(--x,20px),var(--y,-10px))}
.spark{position:fixed;pointer-events:none;font-size:20px;animation:rise linear infinite;opacity:0}
@keyframes heartbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.15)}28%{transform:scale(1)}42%{transform:scale(1.08)}}
@keyframes pulse{50%{text-shadow:0 0 25px #ff4f83}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes photoIn{from{opacity:0;transform:translateY(30px) rotate(-5deg)}to{opacity:1;transform:rotate(-1deg)}}
@keyframes rise{0%{transform:translateY(0) scale(.7);opacity:0}15%{opacity:.85}100%{transform:translateY(-110vh) scale(1.4);opacity:0}}
@media(max-height:700px){.card{padding-top:10px}.photo{max-height:40%}.note{font-size:16px}.heart{font-size:58px}}
</style>
</head>

  <div id="login" class="screen">
    <div class="lock">🔐</div>
    <h1>Sorry ❤️</h1>

    <input id="pw" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autofocus>
    <button class="open" onclick="unlock()">Open ❤️</button>

  </div>

<script>
function unlock(){
 const p=document.getElementById('pw').value;
 if(p==='0406'){
   document.getElementById('login').classList.add('hidden');
   document.getElementById('card').classList.remove('hidden');
   hearts();
 } else {
   document.getElementById('err').textContent='Wrong password';
   document.getElementById('pw').value='';
 }
}
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});

function escapeNo(){
 const b=document.getElementById('nope');
 b.style.setProperty('--x',(Math.random()*140-70)+'px');
 b.style.setProperty('--y',(Math.random()*100-50)+'px');
 b.style.transform=`translate(${Math.random()*140-70}px,${Math.random()*100-50}px)`;
 setTimeout(()=>b.style.transform='',450);
}
function bestie(){
 const b=document.querySelector('.best');
 b.textContent='❤️ My Bestiee ❤️';
 document.querySelector('.sorry').textContent='Thank you ❤️';
}
function hearts(){
 for(let i=0;i<18;i++){
  const s=document.createElement('span'); s.className='spark';
  s.textContent=Math.random()>.35?'♥':'✦';
  s.style.left=Math.random()*100+'vw';
  s.style.bottom='-30px';
  s.style.animationDuration=(5+Math.random()*6)+'s';
  s.style.animationDelay=Math.random()*4+'s';
  document.body.appendChild(s);
 }
}
</script>
